# Precision Category: 計測精度 (15 ルール、5/5 中身)
name: "Precision - Measurement"
version: "1.0"
last_updated: "2026-05-05"
layer: precision_category
category: measurement

rules:
  - { id: PC-MS-01, layer: precision_category, category: measurement, name: "Pixel + CAPI dedup_key 整合", severity: high, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: F-MF-02, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c, b2b, both] }, trigger: { condition: "client_state.dedup_key_alignment_verified == False", operator: AND }, data_source: [{ source: client_state, fields: [dedup_key_alignment_verified] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "event_id 不一致は dedup 機能不全、CV 二重計上を再発" }
  - { id: PC-MS-02, layer: precision_category, category: measurement, name: "EMQ スコア 6.0 以上の維持", severity: high, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: M02, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.capi_emq_score < 6.0", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [capi_emq_score] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "EMQ < 6.0 は CAPI 機能不全、CPA 改善効果が出ない" }
  - { id: PC-MS-03, layer: precision_category, category: measurement, name: "サーバー側 CV と Pixel CV の差分監視", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: PC-MS-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.server_pixel_cv_gap_pct > 30", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [server_pixel_cv_gap_pct] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "30% 超の差分は片側計測不全、調査必須" }
  - { id: PC-MS-04, layer: precision_category, category: measurement, name: "CV ラグ計測 (click_through_window)", severity: medium, polarity: negative, axis_position: TO-10, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.cv_window_optimized == False", operator: AND }, data_source: [{ source: client_state, fields: [cv_window_optimized] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "CV ウィンドウ短すぎで CV 取りこぼし、長すぎでアトリビューション歪み" }
  - { id: PC-MS-05, layer: precision_category, category: measurement, name: "アプリイベント計測 (Mobile Measurement Partner)", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google, tiktok], business_models: [b2c] }, trigger: { condition: "client_state.has_mobile_app == True and client_state.mmp_implemented == False", operator: AND }, data_source: [{ source: client_state, fields: [has_mobile_app, mmp_implemented] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "AppsFlyer / Adjust 等 MMP 未連携でアプリ広告計測不可" }
  - { id: PC-MS-06, layer: precision_category, category: measurement, name: "ピクセルイベント送信タイミング最適化", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.pixel_event_timing_optimized == False", operator: AND }, data_source: [{ source: client_state, fields: [pixel_event_timing_optimized] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "ページロード前送信で計測欠損、DOM ready 後が推奨" }
  - { id: PC-MS-07, layer: precision_category, category: measurement, name: "イベントパラメータの完全性", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: M02, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.event_param_completeness_pct < 80", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [event_param_completeness_pct] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "value/currency/content_ids 等の欠損で AEM value 最適化が機能しない" }
  - { id: PC-MS-08, layer: precision_category, category: measurement, name: "iOS SKAN ポストバック取得率", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: F-PP-04, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.skan_postback_rate_pct < 50", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [skan_postback_rate_pct] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "SKAN 4.0 で 3 ポストバック対応、取得率 50% 未満は設定見直し" }
  - { id: PC-MS-09, layer: precision_category, category: measurement, name: "デバイス間 CV 紐付け (Cross-Device)", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c] }, trigger: { condition: "client_state.cross_device_tracking_enabled == False", operator: AND }, data_source: [{ source: client_state, fields: [cross_device_tracking_enabled] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "Lookalike + 1st party データ精度に直結" }
  - { id: PC-MS-10, layer: precision_category, category: measurement, name: "計測タグ JSON-LD 構造化", severity: low, polarity: negative, axis_position: null, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [ec_d2c], ec_platforms: [all], ad_platforms: [google], business_models: [b2c] }, trigger: { condition: "client_state.json_ld_product_schema == False", operator: AND }, data_source: [{ source: client_state, fields: [json_ld_product_schema] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "GMC 商品認識精度向上、Rich Result 表示の前提" }
  - { id: PC-MS-11, layer: precision_category, category: measurement, name: "GA4 CV 設定の Meta CAPI 一致", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.ga4_meta_cv_alignment_verified == False", operator: AND }, data_source: [{ source: client_state, fields: [ga4_meta_cv_alignment_verified] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "GA4 と Meta で CV 定義ズレは数値不整合の根本原因" }
  - { id: PC-MS-12, layer: precision_category, category: measurement, name: "ConsentMode v2 (Google) 対応", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: F-PP-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [google], business_models: [b2c] }, trigger: { condition: "client_state.consent_mode_v2_implemented == False", operator: AND }, data_source: [{ source: client_state, fields: [consent_mode_v2_implemented] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "Google 広告 ConsentMode v2 必須化済、未対応で計測機能制限" }
  - { id: PC-MS-13, layer: precision_category, category: measurement, name: "イベントカスタム時間帯ズレ確認", severity: low, polarity: negative, axis_position: null, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: F-MF-10, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.event_timezone_audit_done == False", operator: AND }, data_source: [{ source: client_state, fields: [event_timezone_audit_done] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "サーバー時刻 UTC / Pixel JST 等の混在で日次集計不整合" }
  - { id: PC-MS-14, layer: precision_category, category: measurement, name: "アトリビューションウィンドウ統一", severity: medium, polarity: negative, axis_position: TO-04, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.attribution_window_unified == False", operator: AND }, data_source: [{ source: client_state, fields: [attribution_window_unified] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "媒体間でウィンドウ違うと CV 重複計上 / 取りこぼし" }
  - { id: PC-MS-15, layer: precision_category, category: measurement, name: "計測タグ監視 (Tag Health Check)", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.tag_health_monitoring == False", operator: AND }, data_source: [{ source: client_state, fields: [tag_health_monitoring] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_measurement.md.j2, rationale: "サイト改修時のタグ消失検知、ObservePoint 等のツール導入推奨" }
