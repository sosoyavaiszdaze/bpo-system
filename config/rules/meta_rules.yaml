    業界常識: 目標 CPA を強気に設定して配信を絞り込む発想。学習が回らないまま停止判断。
    当社の判断: 目標値は学習挙動を直接左右する。緩めから始め段階的に絞る。学習中の頻繁変更は避ける。high 維持。
