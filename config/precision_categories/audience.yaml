  - { id: PC-AU-09, layer: precision_category, category: audience, name: "地域ターゲティング精度", severity: low, polarity: negative, axis_position: TO-01, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [local_service, real_estate, healthcare_clinic], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c] }, trigger: { condition: "client_state.geo_targeting_radius_optimized == False", operator: AND }, data_source: [{ source: client_state, fields: [geo_targeting_radius_optimized] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "ローカル業種の半径設定、過広 / 過狭で配信効率悪化" }
  - { id: PC-AU-10, layer: precision_category, category: audience, name: "オーディエンスキャップ (頻度上限)", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.frequency_avg > 3.5", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [frequency_avg] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "Frequency 3.5 超でブランド毀損リスク、Frequency Cap 設定推奨" }
  - { id: PC-AU-11, layer: precision_category, category: audience, name: "ファーストパーティ + 3rd party データの統合", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: PC-AU-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c] }, trigger: { condition: "client_state.first_third_party_data_integrated == False", operator: AND }, data_source: [{ source: client_state, fields: [first_third_party_data_integrated] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "DMP 経由の興味関心データ追加でリーチ拡大" }
  - { id: PC-AU-12, layer: precision_category, category: audience, name: "オーディエンス分析と学習データ最適化", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "client_state.audience_insights_reviewed_days > 60", operator: AND }, data_source: [{ source: client_state, fields: [audience_insights_reviewed_days] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "60 日以上分析レビューなしでオーディエンス最適化機会損失" }
