# Pilotton 自動提案エンジン用 client_state (ADR-013 多層ルール trigger 評価入力)
#
# 目的: trigger.condition で client_state.* を評価できるようにする。
# 値の方針:
#   - True/False  : kickoff 段階で確定済の事実
#   - null         : 未確認 (= eval 時に AttributeError 防止のため _DotDict が None を返す)
#   - 数値          : 5/3 ChatWork で確認済の現状値
#
# 5/7 Pilotton 提案までの一次データ:
#   - ec_d2c × ecforce × cosmetics_health の組合せから発火するルールを優先
#   - ChatWork 経由で 5/3 にユーザ確認した「ECフォース利用、薬機法対象、CAPI 未実装」事実
#
# 更新ルール: kickoff インタビュー後に毎週 1 回 Zynect 担当が実値で更新
