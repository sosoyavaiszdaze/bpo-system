- id: M09
  name: 学習フェーズ脱出率
  category: 予算_入札
  severity: critical
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer2
  quick_win: true
  primary_axis: TO-10
  secondary_axis: TO-02
  axis_position: neutral
  polarity: preserve
  prerequisite:
  - M10
  - M13
  conflicts: []
  dependencies: []
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-β 学習フェーズ保護原則 — Meta 特有の 50CV/週基準。これを下回ると最適化不安定。
    業界常識: 学習フェーズ自体を意識せず予算・ターゲットを頻繁に変更し、学習を繰り返しリセット。
    当社の判断: 学習中の広告セット数 / 全広告セット数を月次メトリクス化。critical 維持。
    Andromeda 後の補正: Advantage+ は手動より約 30% 速く学習脱出するため、ASC 化が脱出加速の手段。
    米満氏理論との関係: Google P2 (機械学習保護) 派生 — Meta 固有の 50CV/週基準を伴う。
  expected_impact:
    primary_metric: cpa_change_pct
    primary_value: -22
    confidence: medium
    impact_horizon_weeks: 4
    rationale: 学習フェーズ滞留中の広告セットは CPA変動±35%。脱出後は±12%程度に収束しCPA約20%改善。50CV/週基準を満たすには予算集中または広告セット集約が必要。
  enabled: true
  meta_principle_alignment:
    primary: M-β
    secondary: []
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
- id: M10
  name: 1広告セットあたりCV数
  category: 予算_入札
  severity: high
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer2
  quick_win: false
