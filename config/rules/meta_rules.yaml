    主原則: M-θ iOS14 計測欠損前提運用 — 計測欠損の認識自体が運用判断の前提。
    業界常識: Reported CV を真値と扱い、欠損の存在を意識しない。
    当社の判断: iOS 比率 × ATT オプトアウト率 (推定 70〜85%) を月次計測欠損係数として算出。high 維持。
    Andromeda 後の補正: Modeled Conversions と Lift テストの併用が標準化されつつある。
    米満氏理論との関係: Meta 固有 (M-θ)。Google には対応概念なし。
  expected_impact:
    primary_metric: learning_signal_quality_pct
    primary_value: 10
    confidence: medium
    impact_horizon_weeks: 4
    rationale: iOS14欠損の認識自体が運用判断の前提。Reported vs Modeled CVの差分把握で過小評価CPAに振り回されず、合理的な意思決定が可能になる。直接の数値改善より判断品質改善。
  enabled: true
  meta_principle_alignment:
