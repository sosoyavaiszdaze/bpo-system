    業界常識: ABO で個別広告セットの予算を細かく管理することがベストプラクティスと信じられている。
    当社の判断: 自動化前提時代では CBO デフォルト。ABO は手動上書きの判断基準 (B2B / リターゲ等) のみ。medium 維持。
    Andromeda 後の補正: CBO + ASC の組合せが標準化。
