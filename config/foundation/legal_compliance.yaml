  - id: F-LC-12
    layer: foundation
    category: legal_compliance
    name: "過去違反履歴・行政指導の確認"
    severity: medium
    polarity: neutral
    axis_position: null
    root_cause_group: independent
    duplicate_factor: 1.0
    prerequisite: F-LC-11
    applies_to:
      countries: [JP]
      verticals: [all]
      ec_platforms: [all]
      ad_platforms: [all]
      business_models: [b2c]
    trigger:
      condition: "client_state.past_violations_disclosed == False"
      operator: AND
    data_source:
