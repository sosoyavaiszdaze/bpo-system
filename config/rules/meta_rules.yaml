name: Meta Ads Audit Rules v2.2
version: '2.2'
# Phase 3 redesign v2 (2026-05): + 新規ルール5件 (M66-M70) + category_type 追加 + disabled 精査
# severity 変更 7件: M58/M47/M59 (medium→high), M49/M44 (high→critical), M62/M61 (medium→high)
# M64 (地域精度) を未分類→ M-ε 主紐付けに救済
# 詳細: docs/principles/meta_principles.md, docs/principles/meta_rule_mapping.md
category_weights:
  クリエイティブ: 0.36
  構造_設定: 0.24
  計測_トラッキング: 0.16
  ターゲティング: 0.13
  予算_入札: 0.11
rules:
- id: M01
  name: Pixel発火状態
  category: 計測_トラッキング
  severity: critical
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer3
  quick_win: true
  primary_axis: TO-11
  secondary_axis: TO-02
  axis_position: neutral
  polarity: neutral
  prerequisite: []
  conflicts: []
  dependencies:
  - M02-M08
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-α 計測=シグナル基盤原則 — 全運用判断の前提として Pixel + CAPI のデュアル計測を最上位に置く。
    業界常識: Pixel が動いていれば計測 OK。設定後は放置気味で月次の発火率確認は形式的。
    当社の判断: Pixel 発火停止は全シグナル送出の途絶を意味し、全自動入札の学習が即時破綻する。月次監査で発火率 99%+ を確認、未満なら緊急対応。critical 維持。
    Andromeda 後の補正: 基盤レイヤーは Andromeda 影響を受けず。ただし Pixel 単独では iOS14 後シグナル欠損を補えないため CAPI (M02) との同時運用が前提。
    米満氏理論との関係: Google P1 (計測精度=学習シグナル精度) と同一思想。
  expected_impact:
    primary_metric: learning_signal_quality_pct
    primary_value: 35
    confidence: high
    impact_horizon_weeks: 1
    rationale: Pixel未発火では Meta自動入札が学習材料を失い最適化が不可能。修復で全運用判断の前提が成立し、後続のEMQ・CAPI改善も意味を持つ。最優先で対応すべきcritical項目。
  enabled: true
  meta_principle_alignment:
    primary: M-α
    secondary: [M-θ]
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
- id: M02
  name: CAPI実装状況
  category: 計測_トラッキング
  severity: critical
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer2
  quick_win: true
  primary_axis: TO-11
  secondary_axis: TO-02
  axis_position: neutral
  polarity: neutral
  prerequisite:
  - M01
  conflicts: []
  dependencies:
  - M03
  - M06
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-α — Pixel + CAPI のデュアル + EMQ 監視は 2026 年における必須インフラ。
    業界常識: CAPI は「設定が面倒な追加施策」として後回しにされがち。Pixel のみで運用継続するケース多数。
    当社の判断: CAPI 単独運用ではシグナル精度が不足し自動入札の学習が遅延。iOS14 後は実質必須インフラ。critical 維持。
    Andromeda 後の補正: Andromeda は CAPI 経由のシグナル質に依存度を高めており、未実装は致命的。
    米満氏理論との関係: Google P1 同一 + Meta 固有の M-θ (iOS14 計測欠損前提) 副紐付け。
  expected_impact:
    primary_metric: cv_count_change_pct
    primary_value: 18
    confidence: high
    impact_horizon_weeks: 2
    rationale: CAPI未実装はiOS14以降の計測欠損を補えずCV数を15〜25%失っている状態。実装でPixel欠損分が補われReported CVが回復し、AI入札の学習データも厚くなる。
  enabled: true
  meta_principle_alignment:
    primary: M-α
    secondary: [M-θ]
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
- id: M03
  name: イベントマッチ品質
  category: 計測_トラッキング
  severity: high
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer2
  quick_win: true
  primary_axis: TO-02
  secondary_axis:
  axis_position: neutral
  polarity: neutral
  prerequisite:
  - M02
  conflicts: []
  dependencies: []
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-α — EMQ は Meta 固有の定量スコア (0-10)。Purchase 8.8〜9.3、AddToCart 8.0+、PageView 6.5〜7.5 が目標。
    業界常識: EMQ という指標自体が認知されておらず管理対象外。
    当社の判断: 月次で EMQ ≥ 7.0 (Purchase) を閾値運用。8.0 を超えたら追加投資より他項目に注力 (上限追求は弊害)。high 維持。
    Andromeda 後の補正: なし (基盤レイヤー)。
    米満氏理論との関係: Google P1 同一思想 (シグナル品質の定量化)。
  expected_impact:
    primary_metric: cpa_change_pct
    primary_value: -12
    confidence: high
    impact_horizon_weeks: 2
    rationale: Purchase EMQ 6.0→8.0の改善で CPA約10〜15%改善（Triple Whale実証）。ハッシュ化メール常時送信が最も効果的な改善策で実装難易度も中程度。
  enabled: true
  meta_principle_alignment:
    primary: M-α
    secondary: []
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
- id: M04
  name: ドメイン検証
  category: 計測_トラッキング
  severity: critical
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer2
  quick_win: true
  primary_axis: TO-11
  secondary_axis:
  axis_position: neutral
  polarity: neutral
  prerequisite: []
  conflicts: []
  dependencies:
  - M05
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-θ iOS14 計測欠損前提運用 — AEM (Aggregated Event Measurement) の前提条件。
    業界常識: 「設定済み」というチェック項目程度で意義の理解が薄い。
    当社の判断: ドメイン未検証は AEM 機能停止と同義で iOS14 計測が完全破綻する。critical 維持。月次の検証ステータス監査必須。
    Andromeda 後の補正: 2025/6 の AEM 8 イベント上限撤廃後も、ドメイン検証は前提条件のまま継続。
    米満氏理論との関係: Meta 固有 (M-θ)。Google には対応概念なし。
  expected_impact:
    primary_metric: learning_signal_quality_pct
    primary_value: 15
    confidence: high
    impact_horizon_weeks: 1
    rationale: ドメイン検証はAEM（Aggregated Event Measurement）の前提条件。未検証ではiOS14後のCV計測が機能せず、優先度イベント設定も活きない。設定自体は数十分で完了。
  enabled: true
  meta_principle_alignment:
    primary: M-θ
    secondary: [M-α]
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
- id: M05
  name: 優先度イベントの設定
  category: 計測_トラッキング
  severity: high
  weight: 1.0
  platform: meta
  placement: 共通
  detection_layer: Layer2
  quick_win: false
  primary_axis: TO-02
  secondary_axis: TO-11
  axis_position: neutral
  polarity: neutral
  prerequisite:
  - M04
  conflicts: []
  dependencies: []
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-θ — 学習優先順位の人的設計。AEM の優先度設定は iOS14 ATT 文脈で重要。
    業界常識: デフォルト Purchase のまま放置、戦略的設定は稀。
    当社の判断: 業種・KPI に応じた優先度設計が学習効率を左右。high 維持。AEM 上限撤廃後も重要度は変わらず。
    Andromeda 後の補正: 8 イベント上限撤廃で柔軟性向上したが、戦略的順位付けの必要性は継続。
    米満氏理論との関係: Meta 固有 (M-θ)。
  expected_impact:
    primary_metric: cv_count_change_pct
    primary_value: 8
    confidence: medium
    impact_horizon_weeks: 3
    rationale: AEMの優先度を事業価値順に設計するとiOS環境でも上位イベントのCV計測が確保される。デフォルト放置から最適配置でCV数約8%回復が見込める。
  enabled: true
  meta_principle_alignment:
    primary: M-θ
    secondary: [M-α]
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
- id: M06
  name: 重複イベント排除
  category: 計測_トラッキング
  severity: high
  weight: 1.0
  platform: meta
  placement: 共通
