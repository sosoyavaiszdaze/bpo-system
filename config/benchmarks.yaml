# =============================================================================
# Benchmarks for v3 Report 3-Axis Comparison (v3.1: 直接 JPY 表記版)
# =============================================================================
# 用途: v3 レポートの「現状値 / 業界平均 / Zynect 推奨水準」3軸比較で利用する
# 業界別ベンチマーク値の集約ファイル。
#
# v3.1 変更点 (Task B):
#   - 全 CPA / CPC / CPM 値を直接 JPY で表記（USD→JPY 自動換算ロジックは廃止）
#   - 出典には USD 原値と為替（150 JPY/USD）の換算根拠を脚注で残す
#   - beauty_d2c 業界を新設（パイロットン PoC 第1号で必須）
#
# 値の意味:
#   - industry_avg: 業界平均（中央値またはレポート出典の "average"）
#   - zynect_recommended: 米満氏理論ベースで Zynect が推奨する水準
#   - source: 出典（記事URL or 出版日付）
#
# 単位: CTR/CVR は %、CPC/CPA/CPM は JPY、ROAS は倍率、Frequency は回数
# =============================================================================

meta:
  version: "3.1"
  created_at: "2026-05-01"
  last_updated: "2026-05-02"
  next_review: "2026-08-01"
  jpy_rate_used_for_conversion: 150  # USD → JPY 換算時に使用した参考為替（脚注用、ロジックでは未使用）
  unit_notes: "CTR/CVR は %、CPC/CPA/CPM は JPY (USD ソースは出典で × 150 換算済み)、ROAS は倍率、Frequency は回数/月"

