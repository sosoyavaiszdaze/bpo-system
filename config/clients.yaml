defaults:
  timezone: "Asia/Tokyo"
  currency: "JPY"
  schedule: "0 9 * * *"
  anthropic_model: "claude-sonnet-4-6"

  anthropic_model_premium: claude-opus-4-7
clients:
  yamamoto_demo:
    company:
      name: '山本テクノロジー株式会社'
      honorific: 御中
      industry: 'ec_retail'
      industry_label: 'EC・通販'
    contact:
      name: '山本 太郎'
      honorific: 様
      title: 'マーケティング部 部長'
    report:
      display_name: 広告アカウント健康診断レポート
      include_zynect_insights: true
      include_appendix: true
      premium_model_for_insights: false
      report_period_days: 30
    name: "山本デモ"
    active: true
    objective: balanced  # cpa_minimize | cv_maximize | roas_target | balanced

#     # yamamoto_demo は CSV デモ専用。Meta/TikTok/Google API 連携なし（data/yamamoto_demo*.csv からロード）
    ads:
      tiktok:
        advertiser_id: "XXXXXXXXX"
        access_token_env: "TIKTOK_ACCESS_TOKEN_YAMAMOTO"
      google:
        customer_id: "XXX-XXX-XXXX"
        developer_token_env: "GOOGLE_ADS_DEVELOPER_TOKEN"
        credentials_path: "config/google-ads.yaml"
    seo:
      site_url: "https://example.com"
      landing_pages:
      - "https://example.com/lp1"
    adtruth:
      enabled: false
      api_key_env: "ADTRUTH_API_KEY_YAMAMOTO"
    notifications:
      slack:
        webhook_env: "SLACK_WEBHOOK_YAMAMOTO"
        channel: "#yamamoto-ads"
    intent_overrides:
    - rule_ids: ["C05", "C06"]
      reason: "テスト期間中のため意図的に低予算設定"
      registered_by: "運用担当"
      registered_at: "2026-04-30"
      expires_at: "2026-07-31"
      suppress_action: "skip_notification"
    - rule_ids: ["G12"]
      reason: "東京限定キャンペーン"
      registered_by: "クライアント"
      registered_at: "2026-04-30"
      expires_at:
      suppress_action: "add_context_note"
    crm:
      twenty:
        enabled: true
        company_id: ""

  bandal_gaming:
    company:
      name: '株式会社バンダルゲーミング'  # TODO: 正式企業名を要確認
      honorific: 御中
      industry: 'ec_retail'
      industry_label: 'EC・通販'
    contact:
      name: '担当 太郎'  # 仮置き、後で実名に差し替え予定
      honorific: 様
      title: ''
    report:
      display_name: 広告アカウント健康診断レポート
      include_zynect_insights: true
      include_appendix: true
      premium_model_for_insights: false
      report_period_days: 30
    name: "BANDAL GAMING"
    active: true
    objective: cv_maximize
    ads:
      meta:
        account_id: "act_916507360736121"
        access_token_env: "META_ACCESS_TOKEN_BANDAL"
        lookback_days: 90
    notifications:
      platform: "lark"
      lark:
        webhook_env: "LARK_WEBHOOK_BANDAL"
  pilotton:
    # === ADR-013 多層ルール体系 (5/5 拡張) ===
    country: JP
    vertical: ec_d2c                     # Layer 1 マッチング (verticals/ec_d2c.yaml)
    ec_platform: ecforce                 # Layer 2 マッチング (ec_platforms/ecforce.yaml)
    ad_platforms: [meta]                 # Phase B で google 追加予定
    business_model: b2c
    category_subtype: cosmetics_health   # 薬機法対象 (V-EC-01/02 の trigger 用)

    # === ADR-015 MarTech スタック総合管理 (5/7 新設) ===
    # 自動検出 (Phase A 5/7): ec_platform / tag_manager / analytics / ad_platforms / capi_status
    # ヒアリング (Phase A 5/8〜): ma / crm / cdp / ab_testing / chatbot
    # probe_url は kickoff 後に LP/サンクスページの URL を登録予定
    tech_stack:
      probe_url: null                                # kickoff で確定後に設定
      ec_platform:
        value: ecforce
        confidence: high
        source: declared                             # 5/3 ChatWork ヒアリングで確認
        last_verified: "2026-05-03"
      tag_manager:  { value: unknown, confidence: low,  source: pending_hearing }
      analytics:    { value: unknown, confidence: low,  source: pending_hearing }
      cdp:          { value: unknown, confidence: low,  source: pending_hearing }
      ma:           { value: unknown, confidence: low,  source: pending_hearing }
      crm:          { value: unknown, confidence: low,  source: pending_hearing }
      ad_platforms: [meta]                           # clients.yaml 上位の ad_platforms と整合
      capi_status:
        meta:   not_configured                       # 5/3 ヒアリング: CAPI 未実装
        google: not_applicable                       # Google 広告未利用
      ab_testing:   { value: unknown, confidence: low,  source: pending_hearing }
      chatbot:      { value: unknown, confidence: low,  source: pending_hearing }
    auto_proposal:
      enabled: true
      daily_cap: 1                       # ADR-012 default cap
      legal_disclaimer_required: true    # ADR-013 D-6 法令系の disclaimer 強制
    chatwork_rooms:
      main: 435851481                    # ADR-011 自動通知グループ (kickoff で改名)
      staging: 435851481                 # 内部レビュー期間中は本番と共用
    chatwork_mentions:
      daily_todo:
        - account_id: 4078171
          name: "太田 浩嗣"
        - account_id: 6548794
          name: "槇 賢治"
    chatwork_bot_token_env: CHATWORK_BOT_API_TOKEN
    economics:
      aov_jpy: 15000                     # ADR-009 仮値 (kickoff 後実値)
      ltv_aov_ratio: 3.0
      operational_cost_per_indication_jpy: 1000
      false_positive_tolerance: 0.05

    company:
      name: 株式会社パイロットン
      honorific: 御中
      industry: beauty_d2c  # 内部参照キー（v3.1 で beauty_d2c 業界を新設）
      industry_label: 美容・D2C # 表示用（顧客向けレポートでの業界表示）
      ec_platform: ecforce            # Layer 2 マッチング用 (重複記載、互換性のため company 側にも保持)
    contact:
      name: '[要入力: 担当者氏名]'
      honorific: 様
      title: ''
    report:
      display_name: 広告アカウント健康診断レポート
      include_zynect_insights: true
      include_appendix: true
      premium_model_for_insights: false
      report_period_days: 30
    name: 株式会社パイロットン
    active: true
    objective: balanced
    ads:
      meta:
        enabled: true
        account_id: act_566972639374407
        business_id: '1523097655015973'
        access_token_env: META_ACCESS_TOKEN_PILOTTON  # BANDAL 共用→PILOTTON 専用に切替
        lookback_days: 30  # v3.1: PDF カバー「直近30日」表示と整合（旧 90 から変更）
        domains:
        - titanistlab.jp
        - mynailplex.jp
        pixels:
        - id: '1678979499646915'
          name: CLOCKING Pixel
          note: 最終発火 270日前 / 休眠 / 重複疑い（CLOOKING_ピクセルと並存）
          duplicate: true
          dormant_days: 270
        - id: '668329358903771'
          name: CLOCKING_ピクセル
          note: 最終発火 366日前 / 休眠 / 重複疑い（CLOOKING Pixel と並存、こちらの方が古い）
          duplicate: true
          dormant_days: 366
        - id: '1690318315033477'
          name: MYNAILPLEX_LP01
          note: '最終発火 0日前 / アクティブ運用中（MYNAILPLEX ブランド主力ピクセル）'
          duplicate: false
          dormant_days: 0
        - id: '507908412373466'
          name: アゲルキャリア_Pixel
          note: '最終発火 0日前 / アクティブ運用中（アゲルキャリアブランド、MYNAILPLEX とは別商材）'
          duplicate: false
          dormant_days: 0
        - id: '986638556918191'
          name: 削除
          note: 未発火 / 廃止予定（Meta UI で実削除推奨）
          duplicate: false
      google:
        enabled: false
      tiktok:
        enabled: false
    notifications:
      platform: lark
      lark:
        webhook_env: LARK_WEBHOOK_PILOTTON
    intent_overrides: []
    seo:
      enabled: false
    adtruth:
      enabled: false
