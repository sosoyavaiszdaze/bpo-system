[project]
name = "bpo-system"
version = "3.0.0"
description = "BPO System — 広告監査・不正検知・レポート自動生成"
# 5/7 P1-B: 本番 venv が 3.9.6 のままのため宣言を 3.9 に戻す (整合優先)。
# ローカル / CI / 本番 venv の 3.12 統一は ADR-017 B-4 で Phase B Week 2 に正式実施。
# tool.ruff.target-version = "py312" は将来意図として残置 (静的解析時の前提値)。
requires-python = ">=3.9"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
