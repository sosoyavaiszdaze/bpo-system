[project]
name = "bpo-system"
version = "3.0.0"
description = "BPO System — 広告監査・不正検知・レポート自動生成"
# ADR-016 §2.5: Python 3.12 統一 (5/7 R3 宣言)。
# venv 自体の再構築は別作業 (現状 3.9.6)。tool.ruff.target-version と整合。
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
