# 広告コピー品質評価
system: |
  あなたはデジタル広告の専門アナリストです。
  データに基づいた具体的な改善提案を行います。
  日本語で回答してください。

prompts:
  ad_copy_quality:
    name: 広告コピー品質評価
    template: |
      以下の広告キャンペーンデータを分析し、広告コピーの品質を評価してください。

      ## 評価基準
      1. 訴求の明確さ（ターゲットに響くか）
      2. CTA（行動喚起）の強さ
      3. ブランドトーンとの一致性

      ## 出力形式
      - スコア: 1-10
      - 主要課題: 箇条書き3点
      - 改善提案: 具体的に3つ

      ## データ
      {{ context }}

  campaign_structure:
    name: キャンペーン構造最適化提案
    template: |
      以下のキャンペーンデータを分析し、構造の最適化提案を行ってください。

      ## 分析観点
      1. キャンペーン統合/分割の必要性
      2. 予算配分の効率性
      3. ファネル構造（認知→検討→獲得）の完成度

      ## 出力形式
      - 現状評価: 1段落
      - 推奨アクション: 優先度付き箇条書き
      - リスク: 実行時の注意点

      ## データ
      {{ context }}

  budget_allocation:
    name: 予算配分最適化
    template: |
      以下のデータから予算配分の最適化を提案してください。

      ## 分析観点
      1. ROAS/CPA効率に基づく再配分
      2. プラットフォーム間のシナジー
      3. テスト予算の確保

      ## 出力形式
      - 現状: コスト/ROAS/CPA テーブル
      - 推奨配分: パーセンテージで提示
      - 期待効果: 数値化

      ## データ
      {{ context }}

  audience_strategy:
    name: オーディエンス戦略
    template: |
      以下のデータからオーディエンス戦略の改善提案を行ってください。

      ## 分析観点
      1. ターゲティング精度 vs リーチのバランス
      2. ファーストパーティデータの活用度
      3. リマーケティングの効率性

      ## 出力形式
      - 現状評価
      - 推奨変更: 3点
      - A/Bテスト提案

      ## データ
      {{ context }}

  creative_fatigue:
    name: クリエイティブ疲弊度分析
    template: |
      以下のデータからクリエイティブ疲弊の兆候を分析してください。

      ## 判定基準
      1. フリークエンシー ≥ 3.5 → 疲弊リスク
      2. CTR下降トレンド
      3. CPM上昇トレンド
      4. 同一クリエイティブ稼働日数 ≥ 21日

      ## 出力形式
      - 疲弊度: 高/中/低
      - 対象キャンペーン名
      - リフレッシュ推奨: クリエイティブタイプ別

      ## データ
      {{ context }}
