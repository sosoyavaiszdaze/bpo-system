  - id: F-LC-11
    layer: foundation
    category: legal_compliance
    name: "法務体制の有無 (法令系全体の前提条件)"
    severity: medium
    polarity: neutral
    axis_position: null
    root_cause_group: independent
    duplicate_factor: 1.0
    prerequisite: null
    applies_to:
      countries: [JP]
      verticals: [all]
