    業界常識: 標準 CV のみで運用、カスタム設定は使われない。
    当社の判断: B2B や複雑な購買フローではカスタム CV が学習シグナルの質を上げる。medium 維持 (任意施策)。
    Andromeda 後の補正: AEM 上限撤廃でカスタム CV の制約が緩和、活用余地拡大。
    米満氏理論との関係: Google P1 派生。
  enabled: false
