# =============================================================================
# Benchmarks for v3 Report 3-Axis Comparison
# =============================================================================
# 用途: v3 レポートの「現状値 / 業界平均 / Zynect 推奨水準」3軸比較で利用する
# 業界別ベンチマーク値の集約ファイル。
#
# 参照モジュール:
#   analyzers/benchmark_compare.py（新設予定 / Day 4-7）
#   templates/v3/summary.html（新設予定）
#   templates/v3/platform.html（新設予定）
#
# 値の意味:
#   - industry_avg: 業界平均（中央値またはレポート出典の "average"）
#   - zynect_recommended: 米満氏理論ベースで Zynect が推奨する水準
#       → 一般的に業界平均より厳しい値（CTR/CVR/ROAS は高め、CPA/Frequency は低め）
#   - source: 出典（記事URL or 出版日付）
#
# 出典確認できなかった項目は null とし、コメントで「要調査」マークを残す。
#
# 主出典:
#   - AdEspresso（Hootsuite 傘下）2024 Industry Benchmarks
#   - Databox 2024 Q3-Q4 Benchmark Reports
#   - WordStream 2024 Search Advertising Benchmarks（補助）
#
# 単位: CTR/CVR は %、CPC/CPA/CPM は USD（後述の jpy_rate で換算可）、
#       ROAS は倍率、Frequency は回数
#
# 初版作成日: 2026-05-01
# 次回更新予定: 2026-08-01（四半期レビュー）
# =============================================================================

meta:
  version: "1.0"
  created_at: "2026-05-01"
  next_review: "2026-08-01"
  jpy_rate: 150  # 業界平均値が USD ベースの場合に円換算する為替レート（参考値）
  unit_notes: "CTR/CVR は %、CPC/CPA/CPM は USD、ROAS は倍率、Frequency は回数/月"

