name: BPO System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 python-dotenv pytest ruff pydantic

      - name: Lint with ruff
        run: |
          ruff check . --select=E,F,W --ignore=E501,E402

      - name: Run unit tests
        run: |
          python -m pytest tests/test_rule_schema.py tests/test_evaluator_edge_cases.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run ID mapping tests
        run: |
          python -m pytest tests/test_id_mapping.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration.py tests/test_conflict_integration.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run core tests
        run: |
          python -m pytest tests/test_core.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Config validation
        run: |
          python pipeline.py test

      - name: ID mapping coverage check
        run: |
          python -c "
          from engine.id_mapper import get_mapping_coverage
          for p in ['google', 'meta', 'tiktok']:
              cov = get_mapping_coverage(p)
              print(f'{p}: {cov}')
              assert cov['coverage_pct'] > 40, f'{p} mapping coverage too low'
          print('ID mapping validation passed')
          "
        env:
          PYTHONPATH: .
