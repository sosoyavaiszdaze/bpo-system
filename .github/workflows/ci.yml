name: BPO System CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 必須依存 (5/7 P1-A: python-pptx を必須側に明示。pyproject.toml の
          # >=1.0 宣言と整合)。tests/test_pptx_generation.py は importorskip
          # 二重防御済 — 何らかの理由で install 失敗しても CI が崩壊しない。
          pip install pyyaml jinja2 python-dotenv pytest ruff pydantic python-pptx
          # オプショナル依存 (失敗しても CI 続行)
          pip install google-ads anthropic apscheduler flask || true

      - name: Lint with ruff
        run: |
          # CI では実行不能な構文エラー/未定義名だけをゲートする。
          # 既存コードには unused import 等の lint debt が残っているため、
          # 全量 E/F/W は別途 cleanup PR で扱う。
          ruff check . --select=E9,F63,F7,F82

      - name: Run all tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

      - name: Config validation
        run: |
          python pipeline.py test
