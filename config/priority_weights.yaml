# =============================================================================
# v3 Priority Score Weights — Pattern C (effort重視、クイックウィン優先)
# v3.1 Task F: 6グループ再構築 + duplicate_factor + pixel_health 連動
# =============================================================================
# 用途: 優先アクション Top5 のスコアリング係数 + 重複排除集計の係数
# 設計根拠: docs/report_design/v3_priority_score_weights.md パターンC
# 重複排除設計: docs/decisions/meta_rules_classification.md（v3.1 で生成）
#
# 6 グループ構成（v3.1 で 8→6 に再構築）:
#   measurement_foundation       — 計測基盤（Pixel/CAPI/EMQ/AEM/ドメイン検証）
#   delivery_learning_or_structure — 配信学習 + 構造設定（学習フェーズ・予算分散・集約・キャンペーン目的）
#   creative_optimization        — クリエイティブ最適化（CR 量産・疲弊対応・フォーマット網羅）
#   budget_allocation            — 予算配分（CBO/ABO・予算上限・配分バランス）
#   targeting                    — ターゲティング（オーディエンス・1Pデータ・除外）
#   independent                  — 独立施策（他グループに依存しない単発改善）
# =============================================================================

pattern: "C"
description: "effort重視（クイックウィン優先）— 小工数×大インパクトを上位化"
version: "3.1"
last_updated: "2026-05-02"

# === priority_score 計算用 ===
severity_weights:
  critical: 4.8
  high: 2.5
  medium: 1.5
  low: 0.5

confidence_weights:
  high: 1.0
  medium: 0.7
  low: 0.4

effort_normalization: square_root
quick_win_bonus: 1.5

fallback_impact_yen:
  critical: 50000
  high: 20000
  medium: 8000
  low: 2000

default_effort_hours_by_category:
  計測_トラッキング: 8.0
  計測: 8.0
  クリエイティブ: 6.0
  予算_入札: 3.0
  構造_設定: 3.0
  キーワード: 2.0
  ターゲティング: 2.0
  配信面: 2.0
  フィード: 4.0
  判断ログ: 6.0
  performance: 3.0
  wasted_spend: 2.0
  learning: 4.0
  structure: 3.0
default_effort_hours_fallback: 4.0
quick_win_effort_hours: 0.5

critical_alerts:
  max_count: 3
  severity_threshold: critical
  exclude_quick_wins: false

default_monthly_spend_yen: 750000

