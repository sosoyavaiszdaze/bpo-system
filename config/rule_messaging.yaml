    today_action: "プライバシーポリシーに広告タグの送信先と目的が明記されているか確認してください。"
    yes_no_question: "プライバシーポリシーに広告タグ (Meta/Google/etc.) の送信先と目的が明記されていますか?"
    action_options:
      A: "明記済"
      B: "未対応"
      C: "確認したい"
    legal_note: "電気通信事業法の外部送信規律。違反は配信プラットフォームの審査リスクに繋がります。"

  # ============================================================
  # Foundation - privacy_protection
  # ============================================================
  F-PP-01:
    customer_title: "個人情報取得時の利用目的明示の確認"
    performance_category: [review_risk, first_party_data]
    priority: B
    goal_stage: legal_review
    expected_effect:
      - "Customer File / CAPI 連携時の法的リスク低減"
      - "外部送信規律と整合した運用基盤"
    today_action: "LP の入力フォームで利用目的が明示されているか確認してください。"
    yes_no_question: "LP の入力フォームで「個人情報の利用目的」を取得時に明示していますか?"
    action_options:
      A: "明示済"
      B: "一部のみ"
      C: "確認したい"
    legal_note: "個人情報保護法 第18条 (取得時の利用目的通知)。"

  F-PP-02:
    customer_title: "第三者提供の同意取得フローの確認"
    performance_category: [review_risk, first_party_data]
    priority: B
    goal_stage: legal_review
    expected_effect:
      - "Customer File / CAPI 連携時の法的リスク低減"
    today_action: "顧客データを Meta / Google 等に提供する際の同意取得フローを確認してください。"
    yes_no_question: "個人情報を Meta / Google 等の外部に提供する際、同意を取得していますか?"
    action_options:
      A: "取得済"
      B: "一部のみ"
      C: "確認したい"
    legal_note: "個人情報保護法 第27条 (第三者提供の制限)。"

  # ============================================================
  # Foundation - legal_compliance (review_risk として表現)
  # ============================================================
  F-LC-01:
    customer_title: "広告表現に「優良誤認」となるリスクがないかの確認"
    performance_category: [review_risk]
    priority: B
    goal_stage: legal_review
    # LP 文言確認は validator で部分自動化可 (Claude API による誇大表現チェック想定)
    answer_source_preference: [validator, chatwork_reply]
    expected_effect:
      - "広告審査落ち / 配信停止リスクの低減"
      - "LP 改修による配信遅延の予防"
    today_action: "LP の強い表現 (No.1 / 最高 / 必ず) に客観的根拠があるか確認してください。"
    yes_no_question: "LP 内の「No.1」「最高」「必ず」など強い表現に客観的根拠 (調査機関 / データ) はありますか?"
    action_options:
      A: "全て根拠あり"
      B: "一部根拠不足"
      C: "確認したい"
    legal_note: "景品表示法 第5条第1号 (優良誤認表示) — Meta / Google の広告審査でも頻出の落とし穴。"

  F-LC-04:
    customer_title: "EC サイトの特商法表記の確認"
    performance_category: [review_risk]
    priority: B
    goal_stage: legal_review
    expected_effect:
      - "ECフォース系 LP の審査通過率向上"
      - "顧客信頼性 (返品ポリシー透明化) による CVR 改善余地"
