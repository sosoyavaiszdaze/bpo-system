# =============================================================================
# duplicate_factor — 同グループ内 2 件目以降に乗じる重複係数
# 値が小さい = 重複度が高い（同じ根本原因で改善する）
# 値が 1.0 = 完全独立（各施策が独立に効果発揮）
# =============================================================================
duplicate_factors:
  measurement_foundation: 0.2          # 計測基盤は最も重複度高（CAPI実装が他全てを底上げ）
  delivery_learning_or_structure: 0.3   # 学習保護も重複度高
  creative_optimization: 0.5            # CR 系は中程度
  budget_allocation: 0.4                # 予算系は配分相関あり
  targeting: 0.4                        # ターゲティングも一定の相関
  independent: 1.0                      # 独立施策は満額加算
  other: 1.0                            # 未分類

# =============================================================================
# pixel_health 連動オーバーライド
# Pixel 休眠検知時、計測基盤の修復を最優先化するため duplicate_factor を再調整。
# 非 measurement 施策は計測修復前は効果が薄まるため confidence_decay を乗じる。
# =============================================================================
pixel_health_overrides:
  dormant_threshold_days: 270           # この日数以上発火がないピクセルは休眠扱い
  measurement_foundation_duplicate_factor_when_dormant: 0.1  # 計測修復が最優先のため重複係数を更に低く
  non_measurement_confidence_decay_when_dormant: 0.7         # 非計測施策の効果は 70% に減衰

# =============================================================================
# シナリオ予測の振れ幅（confidence ベース、Task G フォールバック）
# ルール側に scenarios フィールドがあれば優先採用
# =============================================================================
scenario_band_pct:
  high: 0.30
  medium: 0.40
  low: 0.50

# =============================================================================
# v3.0 後方互換: 旧 overlap_factor 名と既存集計関数のため一時的に維持
# Phase 2 で完全削除予定
# =============================================================================
rule_root_cause_legacy_v30: false  # true にすると旧 8 グループを併用（現在は使わない）
overlap_factor:
  measurement_foundation: 0.2
  delivery_learning_or_structure: 0.3
  creative_optimization: 0.5
  budget_allocation: 0.4
  targeting: 0.4
  independent: 1.0
  other: 1.0
