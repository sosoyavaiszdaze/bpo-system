  redesign_note: |
    主原則: M-α — Pixel/CAPI 二重計測防止。event_id でのデデュプは EMQ 向上の中核施策。
    業界常識: CAPI 導入時の見落としで二重計測が放置されがち、CV 数の水増しに気付かず。
    当社の判断: 二重計測は CV 数を水増しし学習を誤った方向に導く。high 維持。CAPI 導入時の必須チェック項目。
    Andromeda 後の補正: なし。
    米満氏理論との関係: Google P1 同一思想 (計測の物理的正確性)。
  expected_impact:
    primary_metric: learning_signal_quality_pct
    primary_value: 20
    confidence: high
    impact_horizon_weeks: 1
    rationale: event_idでのデデュプ未実装はPixel/CAPI二重計測を発生させ、学習データが歪む。実装で計測精度が確保されEMQも上昇する。実装は通常1〜2営業日で完了。
  enabled: true
  meta_principle_alignment:
    primary: M-α
    secondary: []
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
  category_type: principle_based
