        fields: [past_violations_disclosed]
    cooldown_days: 90
    daily_cap_group: adr_013_legal
    template: _client_request_legal_compliance_general.md.j2
    legal_reference:
      law: "(該当なし、リスク管理確認)"
      article: "—"
      description: "過去の措置命令・行政指導の有無を把握、再発防止"
      disclaimer: "本指摘は法令違反ではなく、リスク管理上の確認質問です。"
    rationale: "再発防止チェックの基礎情報、消費者庁公表事例検索の前提"
