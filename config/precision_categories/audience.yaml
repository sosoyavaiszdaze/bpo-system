rules:
  - { id: PC-AU-01, layer: precision_category, category: audience, name: "1st Party Customer Audience の鮮度", severity: high, polarity: negative, axis_position: TO-02, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: F-DG-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "client_state.customer_audience_last_updated_days > 30", operator: AND }, data_source: [{ source: client_state, fields: [customer_audience_last_updated_days] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "30 日以上更新なしでマッチ率劣化、Lookalike 精度低下" }
  - { id: PC-AU-02, layer: precision_category, category: audience, name: "Lookalike 1-3% シードの作成", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: PC-AU-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "client_state.lookalike_audience_created == False", operator: AND }, data_source: [{ source: client_state, fields: [lookalike_audience_created] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "新規獲得 CPA -10〜15% の効果、未活用は機会損失" }
  - { id: PC-AU-03, layer: precision_category, category: audience, name: "除外オーディエンス設定 (既存顧客)", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: PC-AU-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c] }, trigger: { condition: "client_state.exclusion_audience_configured == False", operator: AND }, data_source: [{ source: client_state, fields: [exclusion_audience_configured] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "既存顧客への配信は予算非効率、除外で CPA 改善" }
  - { id: PC-AU-04, layer: precision_category, category: audience, name: "詳細ターゲティング過剰絞込み", severity: medium, polarity: negative, axis_position: TO-01, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.audience_size < 100000", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [audience_size] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "10 万未満は学習困難、Advantage+ 詳細ターゲティング活用検討" }
  - { id: PC-AU-05, layer: precision_category, category: audience, name: "Advantage+ オーディエンス活用度", severity: low, polarity: negative, axis_position: TO-11, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "client_state.advantage_plus_audience_used == False", operator: AND }, data_source: [{ source: client_state, fields: [advantage_plus_audience_used] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "Meta 推奨設定、自動拡張で配信機会拡大" }
  - { id: PC-AU-06, layer: precision_category, category: audience, name: "オーディエンス重複の排除", severity: medium, polarity: negative, axis_position: TO-01, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c, b2b] }, trigger: { condition: "ad_platform_data.audience_overlap_pct > 30", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [audience_overlap_pct] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "30% 超の重複は学習データ希薄化、広告セット統合推奨" }
  - { id: PC-AU-07, layer: precision_category, category: audience, name: "リテンション期間設定の最適化", severity: medium, polarity: negative, axis_position: TO-10, root_cause_group: targeting, duplicate_factor: 0.4, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.audience_retention_days_optimized == False", operator: AND }, data_source: [{ source: client_state, fields: [audience_retention_days_optimized] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_audience.md.j2, rationale: "ファネル段階別リテンション期間 (Cart 30d / View 60d 等) で精度向上" }
