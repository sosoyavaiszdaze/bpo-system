# SEO 監査ルール定義
name: SEO Audit Rules
version: "1.0"

category_weights:
  core_web_vitals: 1.4
  performance: 1.2
  seo_basics: 1.0
  mobile: 1.1
  security: 1.3

rules:
  # --- Core Web Vitals ---
  - id: SEO-CWV1
    name: Largest Contentful Paint
    category: core_web_vitals
    severity: critical
    description: LCP ≤ 2.5秒
    threshold: 2.5
    unit: seconds
  - id: SEO-CWV2
    name: First Input Delay
    category: core_web_vitals
    severity: high
    description: FID ≤ 100ms
    threshold: 100
    unit: ms
  - id: SEO-CWV3
    name: Cumulative Layout Shift
    category: core_web_vitals
    severity: high
    description: CLS ≤ 0.1
    threshold: 0.1
  - id: SEO-CWV4
    name: Interaction to Next Paint
    category: core_web_vitals
    severity: high
    description: INP ≤ 200ms
    threshold: 200
    unit: ms
  - id: SEO-CWV5
    name: Time to First Byte
    category: core_web_vitals
    severity: medium
    description: TTFB ≤ 800ms
    threshold: 800
    unit: ms

  # --- Performance ---
  - id: SEO-PF1
    name: PageSpeed Desktop Score
    category: performance
    severity: medium
    description: Desktop score ≥ 80
    threshold: 80
  - id: SEO-PF2
    name: PageSpeed Mobile Score
    category: performance
    severity: high
    description: Mobile score ≥ 50
    threshold: 50
  - id: SEO-PF3
    name: Total Page Size
    category: performance
    severity: medium
    description: ページサイズ ≤ 3MB
    threshold: 3145728
    unit: bytes
  - id: SEO-PF4
    name: DOM Element Count
    category: performance
    severity: low
    description: DOM要素数 ≤ 1500
    threshold: 1500
  - id: SEO-PF5
    name: HTTP Request Count
    category: performance
    severity: medium
    description: リクエスト数 ≤ 50
    threshold: 50
  - id: SEO-PF6
    name: Image Optimization
    category: performance
    severity: medium
    description: 画像の最適化（WebP/AVIF使用率）
  - id: SEO-PF7
    name: JavaScript Bundle Size
    category: performance
    severity: medium
    description: JSバンドル ≤ 500KB
    threshold: 512000
    unit: bytes
  - id: SEO-PF8
    name: Render Blocking Resources
    category: performance
    severity: high
    description: レンダリングブロッキング要素なし
  - id: SEO-PF9
    name: Font Loading Strategy
    category: performance
    severity: low
    description: font-display swap 設定

  # --- SEO Basics ---
  - id: SEO-BS1
    name: Title Tag
    category: seo_basics
    severity: high
    description: タイトルタグ存在 + 60文字以内
  - id: SEO-BS2
    name: Meta Description
    category: seo_basics
    severity: medium
    description: メタディスクリプション存在 + 160文字以内
  - id: SEO-BS3
    name: H1 Tag
    category: seo_basics
    severity: high
    description: H1タグが1つ存在
  - id: SEO-BS4
    name: Heading Hierarchy
    category: seo_basics
    severity: medium
    description: 見出し階層が正しい (H1→H2→H3)
  - id: SEO-BS5
    name: Canonical URL
    category: seo_basics
    severity: high
    description: canonical URL設定
  - id: SEO-BS6
    name: Alt Text Coverage
    category: seo_basics
    severity: medium
    description: 画像のalt属性カバー率 ≥ 90%
    threshold: 90
  - id: SEO-BS7
    name: Internal Links
    category: seo_basics
    severity: low
    description: 内部リンク ≥ 3
    threshold: 3
  - id: SEO-BS8
    name: Structured Data (JSON-LD)
    category: seo_basics
    severity: medium
    description: 構造化データ存在
  - id: SEO-BS9
    name: Robots Meta Tag
    category: seo_basics
    severity: high
    description: robots meta が noindex でない
  - id: SEO-BS10
    name: Open Graph Tags
    category: seo_basics
    severity: low
    description: OGP タグ設定

  # --- Mobile ---
  - id: SEO-MB1
    name: Viewport Meta Tag
    category: mobile
    severity: critical
    description: viewport meta 設定
  - id: SEO-MB2
    name: Touch Target Size
    category: mobile
    severity: medium
    description: タッチターゲット ≥ 48px
    threshold: 48
    unit: px
  - id: SEO-MB3
    name: Font Size Legibility
    category: mobile
    severity: medium
    description: フォントサイズ ≥ 12px
    threshold: 12
    unit: px
  - id: SEO-MB4
    name: Content Width Fit
    category: mobile
    severity: high
    description: 水平スクロールなし

  # --- Security ---
  - id: SEO-SC1
    name: HTTPS
    category: security
    severity: critical
    description: HTTPS 有効
  - id: SEO-SC2
    name: Mixed Content
    category: security
    severity: high
    description: Mixed Content なし
  - id: SEO-SC3
    name: HSTS Header
    category: security
    severity: medium
    description: Strict-Transport-Security ヘッダ
  - id: SEO-SC4
    name: Content Security Policy
    category: security
    severity: medium
    description: CSP ヘッダ設定
  - id: SEO-SC5
    name: X-Frame-Options
    category: security
    severity: low
    description: X-Frame-Options ヘッダ

  # --- LP Quality for Ads ---
  - id: SEO-LP1
    name: LP Form Presence
    category: seo_basics
    severity: high
    description: フォームまたはCTAが存在
  - id: SEO-LP2
    name: LP Load Time
    category: performance
    severity: critical
    description: LP読込 ≤ 3秒 (広告品質に直結)
    threshold: 3.0
    unit: seconds
  - id: SEO-LP3
    name: Ad-LP Message Match
    category: seo_basics
    severity: high
    description: 広告文とLPの訴求一致度
