# Precision Category: データ品質 (12 ルール、5/5 中身)
name: "Precision - Data Quality"
version: "1.0"
last_updated: "2026-05-05"
layer: precision_category
category: data_quality

rules:
  - { id: PC-DQ-01, layer: precision_category, category: data_quality, name: "データ欠損率の常時監視", severity: high, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "ad_platform_data.data_missing_rate_pct > 10", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [data_missing_rate_pct] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "10% 超の欠損は計測基盤の根本問題、即時調査必須" }
  - { id: PC-DQ-02, layer: precision_category, category: data_quality, name: "異常値検知 (Outlier) ルール設定", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.outlier_detection_configured == False", operator: AND }, data_source: [{ source: client_state, fields: [outlier_detection_configured] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "CV 急増/急減の自動アラート、誤計測検知の最後の砦" }
  - { id: PC-DQ-03, layer: precision_category, category: data_quality, name: "CV データの再現性検証", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.cv_data_reconciliation_done == False", operator: AND }, data_source: [{ source: client_state, fields: [cv_data_reconciliation_done] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "Meta vs GA4 vs バックエンドで CV 突合、20% 超乖離は要調査" }
  - { id: PC-DQ-04, layer: precision_category, category: data_quality, name: "計測タグ静的検査 (Lighthouse / WPT)", severity: low, polarity: negative, axis_position: null, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.tag_static_audit_days > 90", operator: AND }, data_source: [{ source: client_state, fields: [tag_static_audit_days] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "Lighthouse Audit / WebPageTest で 90 日に 1 回の静的検査推奨" }
  - { id: PC-DQ-05, layer: precision_category, category: data_quality, name: "ピクセルテスト (Test Events) 定期実行", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c, b2b] }, trigger: { condition: "client_state.test_events_last_run_days > 30", operator: AND }, data_source: [{ source: client_state, fields: [test_events_last_run_days] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "Meta Events Manager Test Events、月次実行で計測健全性確認" }
  - { id: PC-DQ-06, layer: precision_category, category: data_quality, name: "User Data Hash 完全性 (em / ph / fn / ln 等)", severity: high, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: M02, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta], business_models: [b2c] }, trigger: { condition: "ad_platform_data.user_data_completeness_pct < 70", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [user_data_completeness_pct] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "EMQ スコアの主要因、user_data の hash 完全性 70% 未満は要対応" }
  - { id: PC-DQ-07, layer: precision_category, category: data_quality, name: "アトリビューションデータの監視", severity: medium, polarity: negative, axis_position: TO-04, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [meta, google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.attribution_audit_done == False", operator: AND }, data_source: [{ source: client_state, fields: [attribution_audit_done] }], cooldown_days: 60, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "MMM (Marketing Mix Model) との整合確認、アトリ歪み検知" }
  - { id: PC-DQ-08, layer: precision_category, category: data_quality, name: "ファーストパーティ Cookie 寿命管理", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: F-MF-06, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.first_party_cookie_lifetime_managed == False", operator: AND }, data_source: [{ source: client_state, fields: [first_party_cookie_lifetime_managed] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "Safari ITP で 1st party Cookie も短命化、明示管理推奨" }
  - { id: PC-DQ-09, layer: precision_category, category: data_quality, name: "サンプリングレート監視 (GA4)", severity: low, polarity: negative, axis_position: TO-02, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [google], business_models: [b2c, b2b] }, trigger: { condition: "client_state.ga4_sampling_rate_audit_done == False", operator: AND }, data_source: [{ source: client_state, fields: [ga4_sampling_rate_audit_done] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "GA4 サンプリング閾値超過でレポート精度低下、無料版限界の認識" }
  - { id: PC-DQ-10, layer: precision_category, category: data_quality, name: "イベント命名規則の遵守", severity: low, polarity: negative, axis_position: null, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.event_naming_convention_followed == False", operator: AND }, data_source: [{ source: client_state, fields: [event_naming_convention_followed] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "snake_case / camelCase 混在で集計困難" }
  - { id: PC-DQ-11, layer: precision_category, category: data_quality, name: "計測実装変更履歴の管理", severity: low, polarity: negative, axis_position: null, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: F-OQ-03, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.measurement_change_log_maintained == False", operator: AND }, data_source: [{ source: client_state, fields: [measurement_change_log_maintained] }], cooldown_days: 180, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "計測変更履歴が遡れないと数値変動の原因究明不可" }
  - { id: PC-DQ-12, layer: precision_category, category: data_quality, name: "計測 SLA / 監視ダッシュボード", severity: low, polarity: negative, axis_position: null, root_cause_group: measurement_foundation, duplicate_factor: 0.2, prerequisite: PC-DQ-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c, b2b] }, trigger: { condition: "client_state.measurement_dashboard_setup == False", operator: AND }, data_source: [{ source: client_state, fields: [measurement_dashboard_setup] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_precision_dq.md.j2, rationale: "Looker Studio 等で計測健全性ダッシュボード、即時検知体制" }
