# ChatWork 通知メッセージング マッピング (5/8 統合通知 v2 改修)
#
# 目的: 各ルールについて、ChatWork 通知の冒頭に出すメッセージを
#       「法律名」ではなく「広告成果改善アクション」の文脈に変換する。
#
# 5/8 v2 (緊急): rule_messaging 未定義の rule は顧客向けに出さない (fallback 禁止)。
#                内部ログに internal_unmapped_rule として記録する。
#
# goal_stage (5/8 v2 新): 「今月のゴール」に沿った一貫した順番で出すための優先順位
#   1. measurement_recovery: 計測回復 (Pixel / CV / CAPI / Domain / AEM)
#   2. cpa_diagnosis:        CPA 悪化の切り分け (campaign 別 CPA/CVR/CPM/CTR)
#   3. delivery_diagnosis:   配信量低下の切り分け (budget/status/policy/bid)
#   4. first_party_data:     1st party data 整備
#   5. legal_review:         法務・プライバシー (広告審査・配信停止に直結するもの)
#
# answer_source_preference (5/8 v3 ingestion): 各 rule の「答えをどこから取るか」優先順位
#   - api:           媒体公式 API で自動取得可 (例: ドメイン認証 status, Pixel last_fired)
#   - validator:     validators.client_tech_stack_validator で LP probe で確認可
#   - chatwork_reply: 顧客に質問 (上記で取れない場合のみ)
# evaluator は配列順に試行し、上位で取得できたら ChatWork 質問は送らない (質問ノイズ削減)。
# 現状は宣言のみ (Phase A)。実 API 連携は Phase B Week 2-3 で順次接続予定。
#
# 設計指針:
#   - Google Ads Recommendations: 改善提案 + 優先度 + 期待インパクト
#   - Atlassian alert fatigue: 1 日連投せず、優先度 + 次アクションを明示
#   - 法律・規制は legal_note として下部補足、冒頭の認知は広告成果価値で


version: "2.0"
last_updated: "2026-05-08"


# ============================================================
# goal_stage 順序 (本文表示順、 Smaller = 上位)
# ============================================================
goal_stage_order:
  measurement_recovery: 1
  cpa_diagnosis:        2
  delivery_diagnosis:   3
  first_party_data:     4
  legal_review:         5


rules:
  # ============================================================
  # Layer A: anomaly / cross-platform indications
  # ============================================================
  X-PI1:
    customer_title: "Pixel/タグの実装状況の確認"
    performance_category: [measurement_quality]
    priority: A
    goal_stage: measurement_recovery
    answer_source_preference: [api, validator, chatwork_reply]   # Meta API: pixel.last_fired_time
    expected_effect:
      - "CV 計測欠損の即時解消"
      - "Meta 学習データの正常化、CPA 悪化要因の切り分け"
    today_action: "Meta Events Manager で Pixel が「アクティブ」状態かを確認してください。"
    yes_no_question: "Pixel のアクティブ受信は確認できましたか?"
    action_options:
      A: "アクティブ確認済み"
      B: "未確認、これから確認する"
      C: "Pixel 不在の可能性あり"
    legal_note: null

  ANO_CPA_SPIKE:
    customer_title: "CPA 急騰の原因切り分け"
    performance_category: [cpa_diagnosis]
    priority: A
    goal_stage: cpa_diagnosis
    expected_effect:
      - "CPA 悪化の主要因を campaign 単位で特定"
      - "CV 計測不備 / クリエイティブ疲弊 / 入札の何れが主因かを判別"
    today_action: "CPA が前日比で大きく悪化した campaign について、CV 数 / CTR / Frequency の変化を確認してください。"
    yes_no_question: "CPA 悪化 campaign の CV 数 / CTR / Frequency 変化を確認できましたか?"
    action_options:
      A: "確認済 (主因特定)"
      B: "確認したが主因不明"
      C: "未確認、これから確認"
    legal_note: null

  ANO_IMPRESSION_DROP:
    customer_title: "インプレッション急減の原因切り分け"
    performance_category: [delivery_diagnosis]
    priority: A
    goal_stage: delivery_diagnosis
    expected_effect:
      - "配信量低下の主要因 (予算 / 入札 / ステータス / ポリシー) を特定"
      - "配信回復のための次アクション明確化"
    today_action: "Ads Manager で対象 campaign のステータス・配信ペース・ポリシー警告を確認してください。"
    yes_no_question: "campaign のステータス / 配信ペース / ポリシー警告を確認できましたか?"
    action_options:
      A: "確認済 (主因特定)"
      B: "確認したが主因不明"
      C: "未確認"
    legal_note: null

  # ============================================================
  # Foundation - measurement_foundation / account_health
  # ============================================================
  F-AH-04:
    customer_title: "Meta ドメイン認証の状態確認"
    performance_category: [measurement_quality, learning_stability]
    priority: A
    goal_stage: measurement_recovery
    # Meta Business Manager API でドメイン認証 status を直接取得可 (Phase B 接続)
    answer_source_preference: [api, validator, chatwork_reply]
    # 5/7 fix: 実績広告費連動の lift_rate ベース動的算出。
    # 旧固定値は assumed_monthly_spend=¥160万 前提で算出されており、
    # 実績がそれより小さい/大きいクライアントに過大/過小説明になっていた。
    impact_estimate:
      lift_rate:                # 実績月額広告費に対する改善率
        minimum:   0.019        # 1.9%  AEM/iOS 計測欠損補完 (保守試算)
        realistic: 0.050        # 5.0%  CV 帰属の正確化 + 配信学習の安定化
        upper:     0.125        # 12.5% Advantage+ Audience 最適化フル効果
      source_basis: |
        Meta 公式ガイダンス: AEM 完了アカウントで CPA 改善 5-10% 平均、
        計測欠損なしで Advantage+ 最適化が有効化されると最大 12-15% 改善傾向。
      measurement_window:
        signal:  "1-2 週"        # 兆候期間 (Pixel/CV 取得開始)
        verdict: "4 週"          # 効果判定期間 (学習リセット完了)
      # フォールバック (assumed_monthly_spend が取れない時の固定値、ADR-001 確実値)
      assumed_monthly_spend: 1600000
      minimum_fallback:   30000
      realistic_fallback: 80000
      upper_fallback:     200000
    expected_effect:
      - "AEM (集計イベント測定) / iOS 配信最適化の土台整備"
      - "CV 計測と配信学習の安定化"
    today_action: "Meta Business Manager で対象ドメインの認証ステータスを確認してください。"
    yes_no_question: "Meta Business Manager でドメインが「認証済み」になっていますか?"
    action_options:
      A: "認証済み"
      B: "未対応"
      C: "状況不明、確認したい"
    legal_note: null

  F-MF-01:
    customer_title: "Pixel/タグの重複発火による CV 二重計上の解消"
    performance_category: [measurement_quality, learning_stability]
    priority: A
    goal_stage: measurement_recovery
    expected_effect:
      - "CV 二重計上の解消 (CPA 過小算出による予算誤配分の防止)"
      - "Meta 学習データ品質の改善"
    today_action: "1 ページに同じイベントを複数 Pixel で発火させていないか確認してください。"
    yes_no_question: "1 ページで同じイベントを 2 つ以上の Pixel で発火させていませんか?"
    action_options:
      A: "重複なし"
      B: "重複している可能性あり"
      C: "確認したい"
    legal_note: null

  F-MF-02:
    customer_title: "CV イベントの動作確認 (Meta Test Events)"
    performance_category: [measurement_quality]
    priority: A
    goal_stage: measurement_recovery
    # Meta Pixel API で event_match_quality / 直近 event count を確認可
    answer_source_preference: [api, chatwork_reply]
    impact_estimate:
      lift_rate:
        minimum:   0.025     # 2.5%  CV シグナル正常化の最低限
        realistic: 0.075     # 7.5%  EMQ スコア改善 + 学習データ品質向上
        upper:     0.190     # 19%   完全な計測復旧 + 学習加速
      source_basis: |
        Meta 公式: Pixel イベント停止状態の解消で平均 CPA 改善 7-15%。
        EMQ 6.0 以上維持で iOS opt-out CV 補完による計測精度向上。
      measurement_window:
        signal:  "1 週"
        verdict: "4-6 週"
      assumed_monthly_spend: 1600000
      minimum_fallback:   40000
      realistic_fallback: 120000
      upper_fallback:     300000
    expected_effect:
      - "CV 計測の正常動作確認、計測欠損の早期発見"
      - "Meta 学習シグナルの品質保証"
    today_action: "Meta Events Manager の「テストイベント」タブで CV イベントが正しく届くか確認してください。"
    yes_no_question: "テストイベントで CV シグナルが届きましたか?"
    action_options:
      A: "届いた"
      B: "届かない"
      C: "未確認"
    legal_note: null

  F-MF-08:
    customer_title: "アトリビューション設定の確認"
    performance_category: [measurement_quality, cpa_diagnosis]
    priority: A
    goal_stage: measurement_recovery
    expected_effect:
      - "アトリビューションウィンドウ (7d-click / 1d-view 等) の妥当性検証"
      - "CV 過大/過小評価の防止、CPA 数値の正確化"
    today_action: "現在の Meta アトリビューション設定 (クリック後 / ビュー後の日数) を確認してください。"
    yes_no_question: "アトリビューション設定が運用方針と整合していますか?"
    action_options:
      A: "整合済み"
      B: "見直したい"
      C: "現状未確認"
    legal_note: null

  # ============================================================
  # Foundation - data_governance
  # ============================================================
  F-DG-01:
    customer_title: "1st Party Data の広告活用方針の確認"
    performance_category: [first_party_data]
    priority: B
    goal_stage: first_party_data
    answer_source_preference: [chatwork_reply]
    impact_estimate:
      lift_rate:
        minimum:   0.006     # 0.6%  リターゲ除外配信のロス低減
        realistic: 0.025     # 2.5%  類似配信精度向上 (マッチ率 30%)
        upper:     0.094     # 9.4%  Cookie 制限後の Lookalike 完全活用
      source_basis: |
        Cookie 制限後 (iOS / Privacy Sandbox) でも 1st party data ベースの
        類似配信が機能する場合、CPA 改善 3-12% (Meta マッチ率次第)。
      measurement_window:
        signal:  "2-3 週"
        verdict: "6-8 週"
      assumed_monthly_spend: 1600000
      minimum_fallback:   10000
      realistic_fallback: 40000
      upper_fallback:     150000
    expected_effect:
      - "Cookie 制限後 (iOS / Privacy Sandbox) の広告配信安定化"
      - "既存顧客データを使った類似配信 / 除外配信の精度改善"
    today_action: "顧客データを広告運用に使う方針があるか確認してください。"
    yes_no_question: "購入者 / 会員 / メルマガ等の顧客データを広告運用に使う方針はありますか?"
    action_options:
      A: "既に活用中"
      B: "未活用、検討したい"
      C: "活用予定なし"
    legal_note: null

  F-DG-02:
    customer_title: "顧客データ連携時の SHA256 ハッシュ化確認"
    performance_category: [first_party_data, measurement_quality]
    priority: B
    goal_stage: first_party_data
    impact_estimate:
      lift_rate:
        minimum:   0.009     # 0.9%  Customer Audience マッチ率 30% 達成
        realistic: 0.031     # 3.1%  マッチ率 50% で類似配信精度向上
        upper:     0.113     # 11.3% マッチ率 70% フル効果
      source_basis: |
        SHA256 ハッシュ化済 Customer File はマッチ率 30-70% 達成可。
        マッチ率向上は類似配信 / リターゲティング精度に直結。
      measurement_window:
        signal:  "1-2 週"
        verdict: "4-6 週"
      assumed_monthly_spend: 1600000
      minimum_fallback:   15000
      realistic_fallback: 50000
      upper_fallback:     180000
    expected_effect:
      - "Customer Audience のマッチ率改善 (= 配信精度向上)"
      - "CV 計測データの品質向上"
      - "類似配信 / リターゲティング精度の改善"
    today_action: "Customer File / CAPI 連携時のハッシュ化運用を確認してください。"
    yes_no_question: "Customer File / CAPI 連携時に、メール・電話番号を SHA256 でハッシュ化していますか?"
    action_options:
      A: "ハッシュ化済"
      B: "平文送信中"
      C: "確認したい"
    legal_note: "平文の個人情報送信は個人情報保護上のリスクもあります (補足)。"

  F-DG-07:
    customer_title: "外部送信規律の表記確認"
    performance_category: [review_risk]
    priority: B
    goal_stage: legal_review
    expected_effect:
      - "外部送信規律 (2023/6 改正) 準拠による配信停止リスクの低減"
    today_action: "プライバシーポリシーに広告タグの送信先と目的が明記されているか確認してください。"
    yes_no_question: "プライバシーポリシーに広告タグ (Meta/Google/etc.) の送信先と目的が明記されていますか?"
    action_options:
      A: "明記済"
      B: "未対応"
      C: "確認したい"
    legal_note: "電気通信事業法の外部送信規律。違反は配信プラットフォームの審査リスクに繋がります。"

  # ============================================================
  # Foundation - privacy_protection
  # ============================================================
  F-PP-01:
    customer_title: "個人情報取得時の利用目的明示の確認"
    performance_category: [review_risk, first_party_data]
    priority: B
    goal_stage: legal_review
    expected_effect:
      - "Customer File / CAPI 連携時の法的リスク低減"
      - "外部送信規律と整合した運用基盤"
    today_action: "LP の入力フォームで利用目的が明示されているか確認してください。"
    yes_no_question: "LP の入力フォームで「個人情報の利用目的」を取得時に明示していますか?"
    action_options:
      A: "明示済"
      B: "一部のみ"
      C: "確認したい"
    legal_note: "個人情報保護法 第18条 (取得時の利用目的通知)。"

  F-PP-02:
