  dependencies:
  - M09
  conflict_group:
  yonemitsu_alignment: 整合
  redesign_note: |
    主原則: M-β — 学習脱出基準 (50CV/週) を支える指標。集約 (M-ε) と密接連動。
    業界常識: 広告セットを細かく分けて A/B テスト、1AS あたり CV 数を意識しない。
    当社の判断: 50CV/週を確保できる広告セット構成を逆算 (CPA × 50 で必要日予算決定)。high 維持。
    Andromeda 後の補正: 広い広告セット × 少数構成が脱出加速の標準パターン。集約しないと永続的に学習中。
    米満氏理論との関係: Google P2 派生 + P6 (集約) 接続。
  # enabled 変更 (2026-05): false → true (10原則紐付けで有効化)
  expected_impact:
    primary_metric: cpa_change_pct
    primary_value: -15
    confidence: medium
    impact_horizon_weeks: 4
    rationale: 50CV/週未満の広告セットは集約で学習脱出を加速。8広告セット→3広告セットの統合で各セットが学習脱出し、CPA約15%改善。集約は数日で実装可能。
  enabled: true
  meta_principle_alignment:
    primary: M-β
    secondary: [M-ε]
  last_redesign: '2026-05'
  redesign_source: phase3_meta_principles_v1
