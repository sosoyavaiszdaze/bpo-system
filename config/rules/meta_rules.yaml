# Meta Ads 監査ルール定義 (56項目)
# カテゴリ重み: Pixel/CAPI 25%, Creative 25%, Structure 20%, Audience 15%, Bidding 15%

version: "1.0"
category_weights:
  pixel_capi: 0.25
  creative: 0.25
  structure: 0.20
  audience: 0.15
  bidding: 0.15

rules:
  # === Pixel / CAPI (M-PI1-PI10) ===
  - id: M-PI1
    name: Pixel 設置確認
    category: pixel_capi
    severity: critical
    weight: 2.0
  - id: M-PI2
    name: Event Match Quality ≥ 6
    category: pixel_capi
    severity: critical
    weight: 2.0
  - id: M-PI3
    name: CAPI 有効
    category: pixel_capi
    severity: critical
    weight: 2.0
  - id: M-PI4
    name: イベント重複排除
    category: pixel_capi
    severity: high
    weight: 1.5
  - id: M-PI5
    name: Conversions API Gateway
    category: pixel_capi
    severity: medium
    weight: 1.0
  - id: M-PI6
    name: ドメイン認証
    category: pixel_capi
    severity: high
    weight: 1.5
  - id: M-PI7
    name: 8イベント優先順位設定
    category: pixel_capi
    severity: high
    weight: 1.5
  - id: M-PI8
    name: アトリビューション設定（7日/1日）
    category: pixel_capi
    severity: medium
    weight: 1.0

  # === Creative / Andromeda (M-CR1-CR12) ===
  - id: M-CR1
    name: クリエイティブ多様性 ≥10種
    category: creative
    severity: high
    weight: 1.5
  - id: M-CR2
    name: クリエイティブ類似度スコア <60%
    category: creative
    severity: medium
    weight: 1.0
  - id: M-CR3
    name: フリークエンシー疲弊
    category: creative
    severity: high
    weight: 1.5
  - id: M-CR4
    name: 動画完視聴率
    category: creative
    severity: medium
    weight: 1.0
  - id: M-CR5
    name: フォーマット多様性（画像/動画/カルーセル）
    category: creative
    severity: medium
    weight: 1.0
  - id: M-CR6
    name: UGC 比率
    category: creative
    severity: low
    weight: 1.0

  # === Structure (M-ST1-ST18) ===
  - id: M-ST1
    name: キャンペーン数/目的整合性
    category: structure
    severity: medium
    weight: 1.0
  - id: M-ST2
    name: 広告セット数 ≤5/キャンペーン
    category: structure
    severity: high
    weight: 1.5
  - id: M-ST3
    name: 学習フェーズ（≥50CV/週）
    category: structure
    severity: critical
    weight: 2.0
    conflict_group: learning_vs_testing
  - id: M-ST4
    name: CBO/ABO 選択
    category: structure
    severity: medium
    weight: 1.0
  - id: M-ST5
    name: Advantage+ Sales キャンペーン評価
    category: structure
    severity: medium
    weight: 1.0
  - id: M-ST6
    name: キャンペーン目的と最適化イベント一致
    category: structure
    severity: high
    weight: 1.5
  - id: M-ST7
    name: 配信ステータス確認
    category: structure
    severity: medium
    weight: 1.0

  # === Audience (M-AU1-AU6) ===
  - id: M-AU1
    name: オーバーラップ検出
    category: audience
    severity: high
    weight: 1.5
  - id: M-AU2
    name: 除外設定
    category: audience
    severity: medium
    weight: 1.0
  - id: M-AU3
    name: Advantage+ Audience 活用
    category: audience
    severity: medium
    weight: 1.0
    conflict_group: precision_vs_reach
  - id: M-AU4
    name: LLA品質（ソースサイズ/類似度）
    category: audience
    severity: medium
    weight: 1.0
  - id: M-AU5
    name: カスタムオーディエンス鮮度
    category: audience
    severity: low
    weight: 1.0
  - id: M-AU6
    name: リターゲティング期間最適化
    category: audience
    severity: medium
    weight: 1.0

  # === Common Checks (from original ads_audit) ===
  - id: M-C01
    name: CTR最低基準
    category: structure
    severity: medium
    weight: 1.0
  - id: M-C02
    name: CPA スパイク
    category: bidding
    severity: high
    weight: 1.5
  - id: M-C03
    name: ROAS最低基準
    category: bidding
    severity: high
    weight: 1.5
  - id: M-C04
    name: フリークエンシー上限
    category: creative
    severity: high
    weight: 1.5
  - id: M-C05
    name: ゼロCV コスト超過
    category: bidding
    severity: critical
    weight: 2.0
  - id: M-C06
    name: コスト集中度
    category: structure
    severity: medium
    weight: 1.0
