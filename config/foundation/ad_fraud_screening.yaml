# Foundation Layer: 広告不正事前診断 (8 ルール、骨格のみ)
# 重要: 既存 config/rules/adtruth_rules.yaml (F01-F15) とは別物
#       AdTruth (ADR-006) は LP 配置型不正検知、本ファイルは AdTruth 導入前の事前診断
name: "Foundation - Ad Fraud Screening"
version: "0.1-skeleton"
last_updated: "2026-05-05"
layer: foundation
category: ad_fraud_screening

rules:
  - { id: F-AF-01, layer: foundation, category: ad_fraud_screening, name: "業界平均 fraud 率との乖離", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.estimated_fraud_rate_pct > 15", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [estimated_fraud_rate_pct] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "業界推計 14% 超で AdTruth 本実装の優先度向上" }
  - { id: F-AF-02, layer: foundation, category: ad_fraud_screening, name: "短時間多発クリック検知", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.click_velocity_anomaly == True", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [click_velocity_anomaly] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "Phase B Week 2 で詳細実装" }
  - { id: F-AF-03, layer: foundation, category: ad_fraud_screening, name: "不正 CV パターン", severity: high, polarity: negative, axis_position: TO-02, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.cv_pattern_anomaly_score > 0.7", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [cv_pattern_anomaly_score] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "F06 (既存 adtruth_rules.yaml) と連動" }
  - { id: F-AF-04, layer: foundation, category: ad_fraud_screening, name: "MFA (Made For Advertising) 配信", severity: medium, polarity: negative, axis_position: TO-02, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [google], business_models: [b2c] }, trigger: { condition: "ad_platform_data.mfa_placement_share > 0.1", operator: AND }, data_source: [{ source: ad_platform_api, platform: google, fields: [mfa_placement_share] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "Phase B Week 2 で詳細実装" }
  - { id: F-AF-05, layer: foundation, category: ad_fraud_screening, name: "リファラー偽装検知", severity: medium, polarity: negative, axis_position: null, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.referrer_anomaly_count > 100", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [referrer_anomaly_count] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "Phase B Week 2 で詳細実装" }
  - { id: F-AF-06, layer: foundation, category: ad_fraud_screening, name: "エミュレータ・bot 検知", severity: medium, polarity: negative, axis_position: null, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.bot_traffic_share > 0.05", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [bot_traffic_share] }], cooldown_days: 14, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "Phase B Week 2 で詳細実装" }
  - { id: F-AF-07, layer: foundation, category: ad_fraud_screening, name: "ジオロケーション不整合", severity: low, polarity: negative, axis_position: null, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: null, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.geo_mismatch_share > 0.1", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [geo_mismatch_share] }], cooldown_days: 30, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "Phase B Week 2 で詳細実装" }
  - { id: F-AF-08, layer: foundation, category: ad_fraud_screening, name: "AdTruth (ADR-006) 本実装の必要性評価", severity: medium, polarity: neutral, axis_position: null, root_cause_group: independent, duplicate_factor: 1.0, prerequisite: F-AF-01, applies_to: { countries: [JP], verticals: [all], ec_platforms: [all], ad_platforms: [all], business_models: [b2c] }, trigger: { condition: "ad_platform_data.estimated_fraud_rate_pct > 10 and client_state.adtruth_evaluation_done == False", operator: AND }, data_source: [{ source: ad_platform_api, platform: meta, fields: [estimated_fraud_rate_pct] }, { source: client_state, fields: [adtruth_evaluation_done] }], cooldown_days: 90, daily_cap_group: default, template: _client_request_ad_fraud.md.j2, rationale: "AdTruth (ADR-006 Draft) Phase B Week 2-3 実装判断の前提診断" }
