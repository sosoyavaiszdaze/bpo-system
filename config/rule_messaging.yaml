      B: "一部のみ"
      C: "確認したい"
    legal_note: "個人情報保護法 第27条 (第三者提供の制限)。"

  # ============================================================
  # Foundation - legal_compliance (review_risk として表現)
  # ============================================================
  F-LC-01:
    customer_title: "広告表現に「優良誤認」となるリスクがないかの確認"
    performance_category: [review_risk]
    priority: B
    goal_stage: legal_review
    # LP 文言確認は validator で部分自動化可 (Claude API による誇大表現チェック想定)
    answer_source_preference: [validator, chatwork_reply]
    expected_effect:
      - "広告審査落ち / 配信停止リスクの低減"
      - "LP 改修による配信遅延の予防"
    today_action: "LP の強い表現 (No.1 / 最高 / 必ず) に客観的根拠があるか確認してください。"
    yes_no_question: "LP 内の「No.1」「最高」「必ず」など強い表現に客観的根拠 (調査機関 / データ) はありますか?"
    action_options:
      A: "全て根拠あり"
      B: "一部根拠不足"
      C: "確認したい"
    legal_note: "景品表示法 第5条第1号 (優良誤認表示) — Meta / Google の広告審査でも頻出の落とし穴。"

